name: Build Android APK from Grok Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22 # Обновили до 22 версии, чтобы не было ошибок библиотек TanStack
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    # Этот шаг автоматически найдет скрытую папку с index.html и перенесет в dist
    - name: Find and Prepare Web Assets
      run: |
        mkdir -p dist
        TARGET_DIR=$(find .vercel/output -name "index.html" -exec dirname {} \; | head -n 1)
        if [ -n "$TARGET_DIR" ]; then
          echo "Found build assets in $TARGET_DIR, copying to dist..."
          cp -r $TARGET_DIR/* dist/
        else
          echo "index.html not found in .vercel/output, checking root projects..."
          find . -name "index.html"
          exit 1
        fi

    - name: Install Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli
        npx cap init Where-Is-My-Money com.mreliteman.whereismymoney --web-dir=dist

    - name: Add Android Platform
      run: |
        npm install @capacitor/android
        npx cap add android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Sync Code to Android
      run: npx cap sync android

    - name: Build APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
